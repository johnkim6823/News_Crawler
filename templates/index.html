<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>기업 리서치 크롤러</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --bg: #f5f7fa;
            --white: #ffffff;
            --surface: #ffffff;
            --border: #e2e8f0;
            --border-light: #f0f2f5;
            --text: #1e293b;
            --text-sub: #475569;
            --text-dim: #94a3b8;
            --blue: #2563eb;
            --blue-light: #dbeafe;
            --blue-hover: #1d4ed8;
            --blue-50: rgba(37, 99, 235, 0.06);
            --blue-glow: rgba(37, 99, 235, 0.15);
            --green: #16a34a;
            --green-light: #dcfce7;
            --red: #dc2626;
            --red-light: #fee2e2;
            --orange: #ea580c;
            --orange-light: #ffedd5;
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.04);
            --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
            --shadow-md: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            --shadow-lg: 0 10px 15px -3px rgba(0,0,0,0.08), 0 4px 6px -4px rgba(0,0,0,0.04);
            --radius: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        /* ── Toast Notifications ── */
        .toast-container {
            position: fixed;
            top: 72px;
            right: 1.5rem;
            z-index: 9999;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .toast {
            background: var(--white);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 0.8rem 1.2rem;
            box-shadow: var(--shadow-lg);
            display: flex;
            align-items: center;
            gap: 0.6rem;
            min-width: 280px;
            max-width: 400px;
            animation: toastIn 0.3s ease;
            transition: all 0.3s ease;
        }
        .toast.removing {
            opacity: 0;
            transform: translateX(100%);
        }
        .toast-icon {
            width: 20px;
            height: 20px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
        }
        .toast-icon svg { width: 12px; height: 12px; }
        .toast.success .toast-icon { background: var(--green-light); color: var(--green); }
        .toast.error .toast-icon { background: var(--red-light); color: var(--red); }
        .toast.warning .toast-icon { background: var(--orange-light); color: var(--orange); }
        .toast.info .toast-icon { background: var(--blue-light); color: var(--blue); }
        .toast-message { font-size: 0.85rem; color: var(--text); flex: 1; }
        .toast-close {
            background: none; border: none; color: var(--text-dim);
            cursor: pointer; padding: 2px; display: flex;
        }
        .toast-close svg { width: 14px; height: 14px; }
        @keyframes toastIn {
            from { opacity: 0; transform: translateX(100%); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* ── Header ── */
        .header {
            background: var(--white);
            border-bottom: 1px solid var(--border);
            padding: 0 2rem;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: var(--shadow-sm);
            position: sticky;
            top: 0;
            z-index: 100;
        }
        .header-brand {
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }
        .header-logo {
            width: 32px; height: 32px;
            background: var(--blue);
            border-radius: 8px;
            display: flex; align-items: center; justify-content: center;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }
        .header-logo svg { width: 18px; height: 18px; }
        .header h1 {
            font-size: 1.15rem; font-weight: 700;
            color: var(--text); letter-spacing: -0.02em;
        }
        .header-nav { display: flex; gap: 0.4rem; }
        .header-nav button {
            background: transparent; border: 1px solid transparent;
            color: var(--text-sub); padding: 0.45rem 1rem;
            border-radius: var(--radius-sm); cursor: pointer;
            font-size: 0.85rem; font-weight: 500;
            transition: all 0.2s; font-family: inherit;
        }
        .header-nav button:hover { background: var(--blue-50); color: var(--blue); }
        .header-nav button.active {
            background: var(--blue); color: #fff;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
        }

        /* ── Layout ── */
        .container { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem; }

        /* ── Search Card ── */
        .search-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 2.5rem;
            margin-bottom: 1.5rem; box-shadow: var(--shadow-lg);
            position: relative; overflow: hidden;
        }
        .search-card::before {
            content: ''; position: absolute;
            top: 0; left: 0; right: 0; height: 4px;
            background: var(--blue);
        }
        .search-card h2 {
            font-size: 1.4rem; font-weight: 700;
            color: var(--text); margin-bottom: 0.4rem; letter-spacing: -0.02em;
        }
        .search-card .subtitle {
            font-size: 0.9rem; color: var(--text-dim); margin-bottom: 1.5rem;
        }

        /* Quick suggestions */
        .suggestions {
            display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 1.5rem;
        }
        .suggestion-chip {
            background: var(--blue-50); border: 1px solid var(--blue-light);
            color: var(--blue); padding: 0.3rem 0.75rem;
            border-radius: 20px; font-size: 0.78rem; font-weight: 500;
            cursor: pointer; transition: all 0.2s; font-family: inherit;
        }
        .suggestion-chip:hover {
            background: var(--blue-light); box-shadow: var(--shadow-sm);
        }

        .form-row {
            display: flex; gap: 1rem; align-items: flex-end;
        }
        .form-group { flex: 1; }
        .form-group label {
            display: block; font-size: 0.8rem; font-weight: 600;
            color: var(--text-sub); margin-bottom: 0.5rem;
            text-transform: uppercase; letter-spacing: 0.04em;
        }
        .input-wrapper { position: relative; }
        .input-wrapper .input-icon {
            position: absolute; left: 14px; top: 50%;
            transform: translateY(-50%); color: var(--text-dim); display: flex;
        }
        .input-wrapper .input-icon svg { width: 18px; height: 18px; }
        .form-group input {
            width: 100%; background: var(--white);
            border: 1.5px solid var(--border); color: var(--text);
            padding: 0.8rem 0.9rem 0.8rem 2.8rem;
            border-radius: var(--radius-sm); font-size: 0.95rem;
            font-family: inherit; outline: none;
            transition: all 0.2s; box-shadow: var(--shadow-sm);
        }
        .form-group input:hover { border-color: #cbd5e1; }
        .form-group input:focus {
            border-color: var(--blue);
            box-shadow: 0 0 0 3px var(--blue-glow), var(--shadow-sm);
        }
        .form-group input::placeholder { color: var(--text-dim); }

        .btn-primary {
            background: var(--blue); color: #fff; border: none;
            padding: 0.8rem 2rem; border-radius: var(--radius-sm);
            font-size: 0.95rem; font-weight: 600; font-family: inherit;
            cursor: pointer; transition: all 0.2s; white-space: nowrap;
            box-shadow: 0 2px 8px rgba(37, 99, 235, 0.3);
            display: flex; align-items: center; gap: 0.5rem;
        }
        .btn-primary:hover {
            background: var(--blue-hover);
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transform: translateY(-1px);
        }
        .btn-primary:active { transform: translateY(0); }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; box-shadow: none; }
        .btn-primary svg { width: 18px; height: 18px; }
        .btn-primary .spinner {
            width: 16px; height: 16px;
            border: 2px solid rgba(255,255,255,0.3);
            border-top-color: #fff;
            border-radius: 50%;
            animation: spin 0.6s linear infinite;
            display: none;
        }
        .btn-primary.loading .spinner { display: block; }
        .btn-primary.loading .btn-icon { display: none; }
        @keyframes spin { to { transform: rotate(360deg); } }

        /* ── Progress Card ── */
        .progress-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.5rem;
            margin-bottom: 1.5rem; display: none;
            box-shadow: var(--shadow-md);
            animation: fadeSlideIn 0.3s ease;
        }
        .progress-card.show { display: block; }
        @keyframes fadeSlideIn {
            from { opacity: 0; transform: translateY(-8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .progress-header {
            display: flex; justify-content: space-between;
            align-items: center; margin-bottom: 0.6rem;
        }
        .progress-header h3 { font-size: 0.95rem; font-weight: 600; color: var(--text); }
        .progress-header-right { display: flex; align-items: center; gap: 0.6rem; }
        .progress-status {
            font-size: 0.75rem; padding: 0.25rem 0.75rem;
            border-radius: 20px; font-weight: 600; letter-spacing: 0.02em;
        }
        .progress-status.running { background: var(--blue-light); color: var(--blue); }
        .progress-status.completed { background: var(--green-light); color: var(--green); }
        .progress-status.error { background: var(--red-light); color: var(--red); }

        .btn-cancel {
            background: var(--white); border: 1px solid var(--border);
            color: var(--red); padding: 0.25rem 0.7rem;
            border-radius: 6px; font-size: 0.75rem; font-weight: 600;
            cursor: pointer; font-family: inherit; transition: all 0.2s;
        }
        .btn-cancel:hover { background: var(--red-light); border-color: var(--red); }

        .progress-meta {
            display: flex; justify-content: space-between;
            font-size: 0.75rem; color: var(--text-dim);
            margin-bottom: 0.5rem;
        }

        .progress-bar-track {
            width: 100%; height: 6px;
            background: var(--border-light); border-radius: 3px;
            margin-bottom: 1rem; overflow: hidden;
        }
        .progress-bar-fill {
            height: 100%; background: var(--blue);
            border-radius: 3px; transition: width 0.5s ease; width: 0%;
        }
        .progress-bar-fill.indeterminate {
            width: 30%;
            animation: indeterminate 1.5s infinite ease-in-out;
        }
        @keyframes indeterminate {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(400%); }
        }

        .progress-log {
            max-height: 200px; overflow-y: auto;
            font-family: 'SF Mono', 'Fira Code', 'Consolas', monospace;
            font-size: 0.78rem; line-height: 1.7; padding: 0.8rem;
            background: #f8fafc; border: 1px solid var(--border-light);
            border-radius: var(--radius-sm);
        }
        .progress-log::-webkit-scrollbar { width: 4px; }
        .progress-log::-webkit-scrollbar-track { background: transparent; }
        .progress-log::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
        .log-item { padding: 0.1rem 0; }
        .log-item.section { color: var(--blue); font-weight: 600; margin-top: 0.4rem; }
        .log-item.step { color: var(--text-dim); }
        .log-item.complete { color: var(--green); font-weight: 600; }
        .log-item.error { color: var(--red); font-weight: 600; }

        /* ── Results Card ── */
        .results-card {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--radius); display: none;
            box-shadow: var(--shadow-lg); overflow: hidden;
            animation: fadeSlideIn 0.4s ease;
        }
        .results-card.show { display: block; }

        .results-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 1.5rem 2rem; border-bottom: 1px solid var(--border);
            background: #fafbfc;
        }
        .results-header h3 {
            font-size: 1.05rem; font-weight: 700; color: var(--text);
            margin-bottom: 0.5rem;
        }
        .results-stats { display: flex; gap: 2rem; margin-top: 0.3rem; }
        .stat { display: flex; align-items: baseline; gap: 0.4rem; }
        .stat-value { font-size: 1.4rem; font-weight: 700; color: var(--blue); }
        .stat-label { font-size: 0.78rem; color: var(--text-dim); font-weight: 500; }
        .results-actions { display: flex; gap: 0.5rem; flex-wrap: wrap; }
        .btn-action {
            background: var(--white); border: 1.5px solid var(--border);
            color: var(--text-sub); padding: 0.5rem 0.9rem;
            border-radius: var(--radius-sm); font-size: 0.8rem;
            font-weight: 500; font-family: inherit; cursor: pointer;
            transition: all 0.2s; box-shadow: var(--shadow-sm);
            display: flex; align-items: center; gap: 0.4rem;
        }
        .btn-action svg { width: 14px; height: 14px; }
        .btn-action:hover {
            border-color: var(--blue); color: var(--blue); box-shadow: var(--shadow);
        }

        /* ── Summary Dashboard ── */
        .summary-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
            gap: 0.8rem;
            padding: 1.5rem 2rem;
            border-bottom: 1px solid var(--border);
        }
        .summary-card {
            background: var(--bg); border: 1px solid var(--border-light);
            border-radius: var(--radius-sm); padding: 0.8rem 1rem;
            transition: all 0.2s; cursor: default;
        }
        .summary-card:hover { box-shadow: var(--shadow); }
        .summary-card-label {
            font-size: 0.72rem; color: var(--text-dim);
            font-weight: 500; margin-bottom: 0.3rem;
        }
        .summary-card-value {
            font-size: 1.1rem; font-weight: 700; color: var(--text);
        }
        .summary-card-value span {
            font-size: 0.75rem; font-weight: 400; color: var(--text-dim);
        }
        .summary-card-bar {
            height: 3px; background: var(--border-light);
            border-radius: 2px; margin-top: 0.5rem; overflow: hidden;
        }
        .summary-card-bar-fill {
            height: 100%; background: var(--blue);
            border-radius: 2px; transition: width 0.5s ease;
        }

        /* ── Tabs ── */
        .tabs-container {
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border); padding: 0 2rem;
            background: #fafbfc;
        }
        .tabs { display: flex; }
        .tab {
            padding: 0.85rem 1.2rem; color: var(--text-dim);
            cursor: pointer; font-size: 0.85rem; font-weight: 600;
            border-bottom: 2px solid transparent;
            transition: all 0.2s; margin-bottom: -1px;
        }
        .tab:hover { color: var(--text-sub); }
        .tab.active { color: var(--blue); border-bottom-color: var(--blue); }

        /* Search in results */
        .results-search {
            position: relative;
        }
        .results-search input {
            background: var(--white); border: 1px solid var(--border);
            color: var(--text); padding: 0.4rem 0.7rem 0.4rem 2rem;
            border-radius: 6px; font-size: 0.8rem; font-family: inherit;
            outline: none; width: 200px; transition: all 0.2s;
        }
        .results-search input:focus {
            border-color: var(--blue); width: 260px;
            box-shadow: 0 0 0 2px var(--blue-glow);
        }
        .results-search input::placeholder { color: var(--text-dim); }
        .results-search .search-icon {
            position: absolute; left: 7px; top: 50%;
            transform: translateY(-50%); color: var(--text-dim);
        }
        .results-search .search-icon svg { width: 14px; height: 14px; }

        .tab-content { display: none; padding: 2rem; }
        .tab-content.active { display: block; }

        /* ── Report View ── */
        .report-content {
            font-size: 0.9rem; line-height: 1.9; color: var(--text);
        }
        .report-content h1 {
            font-size: 1.5rem; font-weight: 700; color: var(--text);
            margin-bottom: 1rem; padding-bottom: 0.5rem;
            border-bottom: 2px solid var(--blue);
        }
        .report-content h2 {
            font-size: 1.15rem; font-weight: 700; color: var(--blue);
            margin: 2rem 0 0.8rem; padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border);
        }
        .report-content h3 {
            font-size: 1rem; font-weight: 600; color: var(--text);
            margin: 1.5rem 0 0.5rem;
        }
        .report-content p { margin-bottom: 0.6rem; }
        .report-content ul { padding-left: 1.5rem; margin-bottom: 0.8rem; }
        .report-content li { margin-bottom: 0.3rem; color: var(--text-sub); }
        .report-content strong { color: var(--text); font-weight: 600; }
        .report-content a { color: var(--blue); text-decoration: none; font-weight: 500; }
        .report-content a:hover { text-decoration: underline; }
        .report-content hr { border: none; border-top: 1px solid var(--border); margin: 1.2rem 0; }
        .report-content pre {
            background: #f8fafc; border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 1rem 1.2rem;
            overflow-x: auto; margin: 0.8rem 0;
            font-size: 0.8rem; line-height: 1.6;
            box-shadow: inset 0 1px 3px rgba(0,0,0,0.04);
        }
        .report-content code { font-family: 'SF Mono', 'Consolas', monospace; font-size: 0.85em; }
        .report-content blockquote {
            border-left: 3px solid var(--blue); padding: 0.6rem 1rem;
            color: var(--text-sub); background: var(--blue-50);
            border-radius: 0 var(--radius-sm) var(--radius-sm) 0; margin: 1rem 0;
        }
        .report-content em { color: var(--text-dim); }

        /* ── Data View ── */
        .data-section { margin-bottom: 0.8rem; }
        .data-section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0.75rem 1rem; background: var(--white);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
        }
        .data-section-header:hover { box-shadow: var(--shadow); border-color: #cbd5e1; }
        .data-section-header .arrow { transition: transform 0.2s; color: var(--text-dim); }
        .data-section.open .data-section-header .arrow { transform: rotate(90deg); }
        .data-section-left { display: flex; align-items: center; gap: 0.6rem; }
        .data-section-title { font-size: 0.9rem; font-weight: 600; color: var(--text); }
        .data-section-count {
            font-size: 0.72rem; font-weight: 600; color: var(--blue);
            background: var(--blue-light); padding: 0.15rem 0.55rem; border-radius: 10px;
        }
        .data-section-body { display: none; padding: 0.5rem 0; }
        .data-section.open .data-section-body { display: block; }
        .data-section.open .data-section-header {
            border-bottom-left-radius: 0; border-bottom-right-radius: 0;
            border-bottom-color: transparent;
        }
        .data-section.filtered-out { display: none; }
        .data-item {
            background: #fafbfc; border: 1px solid var(--border-light);
            border-radius: var(--radius-sm); padding: 1rem 1.2rem;
            margin-bottom: 0.5rem; transition: box-shadow 0.2s;
        }
        .data-item:hover { box-shadow: var(--shadow); }
        .data-item.filtered-out { display: none; }
        .data-item-title { font-weight: 600; font-size: 0.9rem; color: var(--text); margin-bottom: 0.3rem; }
        .data-item-meta {
            font-size: 0.75rem; color: var(--text-dim); margin-bottom: 0.5rem;
            display: flex; align-items: center; gap: 0.4rem; flex-wrap: wrap;
        }
        .data-item-meta a { color: var(--blue); text-decoration: none; word-break: break-all; }
        .data-item-meta a:hover { text-decoration: underline; }
        .data-item-date {
            background: var(--blue-light); color: var(--blue);
            padding: 0.1rem 0.45rem; border-radius: 4px;
            font-size: 0.7rem; font-weight: 500;
        }
        .data-item-content {
            font-size: 0.8rem; color: var(--text-sub); line-height: 1.6;
            max-height: 150px; overflow-y: auto; white-space: pre-wrap;
            padding: 0.6rem 0.8rem; background: var(--white);
            border: 1px solid var(--border-light); border-radius: 6px; margin-top: 0.4rem;
        }
        .highlight {
            background: #fef08a;
            padding: 0 2px;
            border-radius: 2px;
        }

        /* ── History ── */
        .history-page-header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 1.2rem;
        }
        .history-page-title { font-size: 1.2rem; font-weight: 700; color: var(--text); }
        .history-list { display: flex; flex-direction: column; gap: 0.5rem; }
        .history-item {
            display: flex; justify-content: space-between; align-items: center;
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 1rem 1.5rem;
            cursor: pointer; transition: all 0.2s; box-shadow: var(--shadow-sm);
        }
        .history-item:hover {
            box-shadow: var(--shadow-md); border-color: var(--blue);
            transform: translateY(-1px);
        }
        .history-item-info h4 {
            font-size: 0.95rem; font-weight: 600; color: var(--text); margin-bottom: 0.15rem;
        }
        .history-item-info span { font-size: 0.8rem; color: var(--text-dim); }
        .history-item-right { display: flex; align-items: center; gap: 0.8rem; }
        .history-item-date { font-size: 0.78rem; color: var(--text-dim); font-weight: 500; white-space: nowrap; }
        .btn-delete-history {
            background: none; border: 1px solid transparent; color: var(--text-dim);
            cursor: pointer; padding: 0.3rem; border-radius: 4px;
            transition: all 0.15s; display: flex;
        }
        .btn-delete-history svg { width: 16px; height: 16px; }
        .btn-delete-history:hover { color: var(--red); background: var(--red-light); border-color: var(--red); }

        /* ── Page Views ── */
        .page { display: none; }
        .page.active { display: block; }

        /* ── Empty State ── */
        .empty-state { text-align: center; padding: 4rem 2rem; color: var(--text-dim); }
        .empty-state .empty-icon {
            width: 64px; height: 64px; background: var(--blue-50);
            border-radius: 16px; display: flex; align-items: center;
            justify-content: center; margin: 0 auto 1rem;
        }
        .empty-state .empty-icon svg { width: 28px; height: 28px; color: var(--blue); opacity: 0.5; }
        .empty-state p { font-size: 0.9rem; }

        /* ── Dark Mode ── */
        body.dark {
            --bg: #0f1117;
            --white: #1a1d27;
            --surface: #1a1d27;
            --border: #2e3142;
            --border-light: #242736;
            --text: #e4e6f0;
            --text-sub: #a0a6b8;
            --text-dim: #6b7280;
            --blue-50: rgba(37, 99, 235, 0.12);
            --blue-light: rgba(37, 99, 235, 0.2);
            --blue-glow: rgba(37, 99, 235, 0.25);
            --green-light: rgba(22, 163, 74, 0.15);
            --red-light: rgba(220, 38, 38, 0.15);
            --orange-light: rgba(234, 88, 12, 0.15);
            --shadow-sm: 0 1px 2px rgba(0,0,0,0.2);
            --shadow: 0 1px 3px rgba(0,0,0,0.3);
            --shadow-md: 0 4px 6px rgba(0,0,0,0.3);
            --shadow-lg: 0 10px 15px rgba(0,0,0,0.3);
        }
        body.dark .progress-log,
        body.dark .data-item,
        body.dark .results-header,
        body.dark .tabs-container { background: #141620; }
        body.dark .report-content pre { background: #141620; }
        body.dark .form-group input { background: #141620; }
        body.dark .data-item-content { background: #0f1117; }

        .theme-toggle {
            background: none; border: 1px solid var(--border);
            color: var(--text-sub); width: 36px; height: 36px;
            border-radius: var(--radius-sm); cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .theme-toggle:hover { border-color: var(--blue); color: var(--blue); }
        .theme-toggle svg { width: 18px; height: 18px; }

        /* ── Back to Top ── */
        .back-to-top {
            position: fixed; bottom: 2rem; right: 2rem;
            width: 42px; height: 42px;
            background: var(--blue); color: #fff;
            border: none; border-radius: 50%;
            cursor: pointer; display: none;
            align-items: center; justify-content: center;
            box-shadow: 0 4px 12px rgba(37, 99, 235, 0.4);
            transition: all 0.3s; z-index: 90;
        }
        .back-to-top.show { display: flex; }
        .back-to-top:hover { transform: translateY(-2px); box-shadow: 0 6px 16px rgba(37, 99, 235, 0.5); }
        .back-to-top svg { width: 20px; height: 20px; }

        /* ── TOC Sidebar ── */
        .report-layout { display: flex; gap: 1.5rem; }
        .report-toc {
            width: 200px; flex-shrink: 0;
            position: sticky; top: 80px; align-self: flex-start;
            max-height: calc(100vh - 100px); overflow-y: auto;
        }
        .report-toc-title {
            font-size: 0.72rem; font-weight: 700; color: var(--text-dim);
            text-transform: uppercase; letter-spacing: 0.06em;
            margin-bottom: 0.6rem; padding-bottom: 0.4rem;
            border-bottom: 1px solid var(--border);
        }
        .report-toc a {
            display: block; font-size: 0.78rem; color: var(--text-dim);
            text-decoration: none; padding: 0.3rem 0.5rem;
            border-left: 2px solid transparent;
            border-radius: 0 4px 4px 0; transition: all 0.15s;
            line-height: 1.4;
        }
        .report-toc a:hover { color: var(--blue); background: var(--blue-50); }
        .report-toc a.active { color: var(--blue); border-left-color: var(--blue); font-weight: 600; }
        .report-toc a.toc-h2 { font-weight: 600; margin-top: 0.3rem; }
        .report-toc a.toc-h3 { padding-left: 1rem; font-size: 0.73rem; }
        .report-body { flex: 1; min-width: 0; }

        /* ── Expand/Collapse All ── */
        .data-toolbar {
            display: flex; justify-content: flex-end; gap: 0.4rem;
            margin-bottom: 0.8rem;
        }
        .btn-sm {
            background: var(--white); border: 1px solid var(--border);
            color: var(--text-sub); padding: 0.3rem 0.7rem;
            border-radius: 6px; font-size: 0.75rem; font-weight: 500;
            font-family: inherit; cursor: pointer; transition: all 0.2s;
        }
        .btn-sm:hover { border-color: var(--blue); color: var(--blue); }

        /* ── Keyboard shortcut hints ── */
        .kbd {
            display: inline-block; background: var(--bg);
            border: 1px solid var(--border); border-radius: 4px;
            padding: 0.1rem 0.4rem; font-size: 0.65rem;
            font-family: 'SF Mono', monospace; color: var(--text-dim);
            margin-left: 0.3rem; vertical-align: middle;
            box-shadow: 0 1px 0 var(--border);
        }

        /* ── Compare View ── */
        .compare-grid {
            display: grid; grid-template-columns: 1fr 1fr;
            gap: 1rem; margin-top: 1rem;
        }
        .compare-col {
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 1.2rem;
            box-shadow: var(--shadow);
        }
        .compare-col h4 {
            font-size: 1rem; font-weight: 700; color: var(--blue);
            margin-bottom: 0.8rem; padding-bottom: 0.4rem;
            border-bottom: 2px solid var(--blue);
        }
        .compare-row {
            display: flex; justify-content: space-between;
            padding: 0.4rem 0; border-bottom: 1px solid var(--border-light);
            font-size: 0.82rem;
        }
        .compare-row-label { color: var(--text-sub); }
        .compare-row-value { font-weight: 600; color: var(--text); }
        .compare-bar-container { margin-top: 1rem; }
        .compare-bar-row {
            display: flex; align-items: center; gap: 0.5rem;
            margin-bottom: 0.4rem; font-size: 0.75rem;
        }
        .compare-bar-label { width: 70px; color: var(--text-dim); text-align: right; flex-shrink: 0; }
        .compare-bar-track { flex: 1; height: 8px; background: var(--border-light); border-radius: 4px; overflow: hidden; }
        .compare-bar-fill { height: 100%; border-radius: 4px; transition: width 0.5s; }
        .compare-bar-fill.a { background: var(--blue); }
        .compare-bar-fill.b { background: var(--green); }
        .compare-bar-val { width: 25px; color: var(--text-sub); font-weight: 600; }

        .compare-select-item {
            display: flex; align-items: center; gap: 0.6rem;
            background: var(--white); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 0.7rem 1rem;
            margin-bottom: 0.4rem; cursor: pointer; transition: all 0.2s;
        }
        .compare-select-item:hover { border-color: var(--blue); }
        .compare-select-item.selected { border-color: var(--blue); background: var(--blue-50); }
        .compare-select-item input { accent-color: var(--blue); }
        .compare-select-info { flex: 1; }
        .compare-select-info h5 { font-size: 0.88rem; font-weight: 600; margin-bottom: 0.1rem; }
        .compare-select-info span { font-size: 0.75rem; color: var(--text-dim); }
        .compare-actions { margin-top: 1rem; display: flex; gap: 0.5rem; }

        @media (max-width: 768px) {
            .report-toc { display: none; }
            .compare-grid { grid-template-columns: 1fr; }
        }

        /* ── Print styles ── */
        @media print {
            .header, .search-card, .progress-card, .tabs-container,
            .results-header, .summary-grid, .toast-container,
            .back-to-top, .report-toc, .data-toolbar { display: none !important; }
            .results-card { box-shadow: none !important; border: none !important; }
            .tab-content { display: block !important; padding: 0 !important; }
            #tab-data { display: none !important; }
            body { background: white; }
        }

        /* ── Responsive ── */
        @media (max-width: 768px) {
            .form-row { flex-direction: column; }
            .btn-primary { width: 100%; justify-content: center; }
            .results-header { flex-direction: column; gap: 1rem; align-items: flex-start; }
            .container { padding: 1rem; }
            .search-card { padding: 1.5rem; }
            .tab-content { padding: 1.2rem; }
            .summary-grid { grid-template-columns: repeat(2, 1fr); padding: 1rem; }
            .results-search input { width: 140px; }
            .results-search input:focus { width: 180px; }
        }
    </style>
</head>
<body>
    <!-- Toast Container -->
    <div class="toast-container" id="toast-container"></div>

                <svg id="theme-icon-moon" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M21.752 15.002A9.718 9.718 0 0118 15.75c-5.385 0-9.75-4.365-9.75-9.75 0-1.33.266-2.597.748-3.752A9.753 9.753 0 003 11.25C3 16.635 7.365 21 12.75 21a9.753 9.753 0 009.002-5.998z"/></svg>
            </button>

    </div>

    <div class="container">
        <!-- ===== Search Page ===== -->
        <div id="page-search" class="page active">
            <div class="search-card">

                <!-- Quick Suggestions -->
                <div class="suggestions" id="suggestions">

                    <button class="suggestion-chip" onclick="fillSuggestion('쿠팡', '물류기획')">쿠팡 / 물류</button>
                    <button class="suggestion-chip" onclick="fillSuggestion('토스', 'iOS개발')">토스 / iOS</button>

                <div class="form-row">
                    <div class="form-group">
                        <label>회사명</label>
                        <div class="input-wrapper">
                            <span class="input-icon">
                                <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M3.75 21h16.5M4.5 3h15M5.25 3v18m13.5-18v18M9 6.75h1.5m-1.5 3h1.5m-1.5 3h1.5m3-6H15m-1.5 3H15m-1.5 3H15M9 21v-3.375c0-.621.504-1.125 1.125-1.125h3.75c.621 0 1.125.504 1.125 1.125V21"/></svg>

            trash: '<svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.165L18.16 19.673a2.25 2.25 0 01-2.244 2.077H8.084a2.25 2.25 0 01-2.244-2.077L4.772 5.79m14.456 0a48.108 48.108 0 00-3.478-.397m-12 .562c.34-.059.68-.114 1.022-.165m0 0a48.11 48.11 0 013.478-.397m7.5 0v-.916c0-1.18-.91-2.164-2.09-2.201a51.964 51.964 0 00-3.32 0c-1.18.037-2.09 1.022-2.09 2.201v.916m7.5 0a48.667 48.667 0 00-7.5 0"/></svg>',
        };

        const SECTION_LABELS = {
            company_overview: '회사 개요',
            company_news: '최근 뉴스',
            company_culture: '기업문화',
            company_finance: '재무 실적',
            company_industry: '산업 동향',
            company_recent: '최근 이슈',
            job_info: '직무 소개',
            job_news: '직무 뉴스',
            job_postings: '채용 공고',
            tech_stack: '기술스택',
            interview_reviews: '면접 후기',
            salary_benefits: '연봉/복지',

            job_posting_links: '채용 링크',
        };

        let currentTaskId = null;
        let currentResultData = null;
        let crawlStartTime = null;

        /* ── Toast ── */
        function showToast(message, type = 'info', duration = 3500) {
            const container = document.getElementById('toast-container');
            const iconMap = { success: ICONS.check, error: ICONS.x, warning: ICONS.warn, info: ICONS.info };
            const toast = document.createElement('div');
            toast.className = `toast ${type}`;
            toast.innerHTML = `
                <div class="toast-icon">${iconMap[type]}</div>
                <span class="toast-message">${message}</span>
                <button class="toast-close" onclick="this.parentElement.remove()">${ICONS.x}</button>
            `;
            container.appendChild(toast);
            setTimeout(() => {
                toast.classList.add('removing');
                setTimeout(() => toast.remove(), 300);
            }, duration);
        }

        /* ── Pages & Tabs ── */
        function showPage(page, btn) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(`page-${page}`).classList.add('active');
            document.querySelectorAll('.header-nav button').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            if (page === 'history') loadHistory();
        }

        function switchTab(tab, btn) {
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(c => c.classList.remove('active'));
            btn.classList.add('active');
            document.getElementById(`tab-${tab}`).classList.add('active');
        }

        /* ── Suggestions ── */
        function fillSuggestion(company, job) {
            document.getElementById('company').value = company;
            document.getElementById('job').value = job;
            document.getElementById('company').focus();
            showToast(`${company} / ${job} 선택됨`, 'info', 2000);
        }

        /* ── Crawl ── */
        async function startCrawl() {
            const company = document.getElementById('company').value.trim();
            const job = document.getElementById('job').value.trim();

            if (!company || !job) {
                showToast('회사명과 직무명을 모두 입력해주세요.', 'warning');
                return;
            }

            const btn = document.getElementById('btn-start');
            btn.disabled = true;
            btn.classList.add('loading');

            document.getElementById('progress-card').classList.add('show');
            document.getElementById('results-card').classList.remove('show');
            document.getElementById('progress-log').innerHTML = '';
            document.getElementById('progress-title').textContent = `${company} / ${job} 리서치 중...`;
            document.getElementById('progress-step-count').textContent = '0 / ~65 단계';
            document.getElementById('progress-eta').textContent = '';
            document.getElementById('btn-cancel').style.display = '';

            const statusEl = document.getElementById('progress-status');
            statusEl.className = 'progress-status running';
            statusEl.textContent = '진행 중';

            const bar = document.getElementById('progress-bar');
            bar.style.width = '0%';
            bar.classList.add('indeterminate');

            crawlStartTime = Date.now();
            updateTabTitle(`${company} 리서치 중...`);

            try {
                const res = await fetch('/api/crawl', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ company, job }),
                });
                const result = await res.json();

                if (result.error) {
                    showToast(result.error, 'error');
                    resetBtn();
                    return;
                }

                currentTaskId = result.task_id;
                listenProgress(result.task_id);
            } catch (err) {
                showToast('서버 연결 실패: ' + err.message, 'error');
                resetBtn();
            }
        }

        async function cancelCrawl() {
            if (!currentTaskId) return;
            try {
                await fetch(`/api/cancel/${currentTaskId}`, { method: 'POST' });
                showToast('크롤링 취소 요청됨', 'warning');
                document.getElementById('btn-cancel').style.display = 'none';
            } catch (err) {
                showToast('취소 실패', 'error');
            }
        }

        function resetBtn() {
            const btn = document.getElementById('btn-start');
            btn.disabled = false;
            btn.classList.remove('loading');
        }

        function listenProgress(taskId) {
            const logEl = document.getElementById('progress-log');
            const evtSource = new EventSource(`/api/progress/${taskId}`);
            let stepCount = 0;
            const totalSteps = 65;

            evtSource.onmessage = function (event) {
                const data = JSON.parse(event.data);
                if (data.type === 'ping') return;

                if (data.type === 'section') {
                    const div = document.createElement('div');
                    div.className = 'log-item section';
                    div.textContent = data.message;
                    logEl.appendChild(div);
                } else if (data.type === 'step') {
                    stepCount++;
                    const div = document.createElement('div');
                    div.className = 'log-item step';
                    div.textContent = `  ${data.message}`;
                    logEl.appendChild(div);

                    const bar = document.getElementById('progress-bar');
                    bar.classList.remove('indeterminate');
                    const pct = Math.min((stepCount / totalSteps) * 100, 95);
                    bar.style.width = pct + '%';

                    document.getElementById('progress-step-count').textContent =
                        `${stepCount} / ~${totalSteps} 단계 (${Math.round(pct)}%)`;
                    updateTabTitle(`(${Math.round(pct)}%) 리서치 중`);

                    // ETA
                    if (stepCount > 3 && crawlStartTime) {
                        const elapsed = (Date.now() - crawlStartTime) / 1000;
                        const perStep = elapsed / stepCount;
                        const remaining = Math.round(perStep * (totalSteps - stepCount));
                        const min = Math.floor(remaining / 60);
                        const sec = remaining % 60;
                        document.getElementById('progress-eta').textContent =
                            min > 0 ? `약 ${min}분 ${sec}초 남음` : `약 ${sec}초 남음`;
                    }
                } else if (data.type === 'complete') {
                    const div = document.createElement('div');
                    div.className = 'log-item complete';
                    div.textContent = data.message;
                    logEl.appendChild(div);

                    document.getElementById('progress-status').className = 'progress-status completed';
                    document.getElementById('progress-status').textContent = '완료';
                    document.getElementById('btn-cancel').style.display = 'none';
                    document.getElementById('progress-eta').textContent = '';

                    const bar = document.getElementById('progress-bar');
                    bar.classList.remove('indeterminate');
                    bar.style.width = '100%';
                    document.getElementById('progress-step-count').textContent =
                        `${stepCount} / ${stepCount} 단계 (100%)`;

                    evtSource.close();
                    showToast('리서치가 완료되었습니다!', 'success');
                    sendBrowserNotification('리서치 완료', `${document.getElementById('company').value} 리서치가 완료되었습니다.`);
                    updateTabTitle('');
                    loadResult(taskId);
                    resetBtn();
                } else if (data.type === 'error') {
                    const div = document.createElement('div');
                    div.className = 'log-item error';
                    div.textContent = data.message;
                    logEl.appendChild(div);

                    document.getElementById('progress-status').className = 'progress-status error';
                    document.getElementById('progress-status').textContent = '오류';
                    document.getElementById('btn-cancel').style.display = 'none';
                    document.getElementById('progress-eta').textContent = '';

                    evtSource.close();
                    showToast(data.message, 'error', 5000);
                    updateTabTitle('');
                    resetBtn();
                }

                logEl.scrollTop = logEl.scrollHeight;
            };

            evtSource.onerror = function () {
                evtSource.close();
                resetBtn();
            };
        }

        /* ── Results ── */
        async function loadResult(taskId) {
            try {
                const res = await fetch(`/api/result/${taskId}`);
                const result = await res.json();
                if (result.error) return;
                displayResult(result, taskId);
            } catch (err) {
                console.error('결과 로드 실패:', err);
            }
        }

        function displayResult(result, taskId) {
            currentResultData = result;
            const card = document.getElementById('results-card');
            card.classList.add('show');

            document.getElementById('results-title').textContent =
                `${result.company} / ${result.job} 리서치 결과`;

            document.getElementById('results-stats').innerHTML = `
                <div class="stat"><div class="stat-value">${result.total_items}</div><div class="stat-label">수집 항목</div></div>
                <div class="stat"><div class="stat-value">${Object.keys(result.data).length}</div><div class="stat-label">카테고리</div></div>
            `;

            // Action buttons
            let actionsHtml = `
                <button class="btn-action" onclick="copyReport()">${ICONS.copy} 복사</button>
                <button class="btn-action" onclick="window.print()">${ICONS.print} 인쇄</button>
            `;
            if (taskId) {
                actionsHtml += `
                    <button class="btn-action" onclick="location.href='/api/download/${taskId}/md'">${ICONS.download} MD</button>
                    <button class="btn-action" onclick="location.href='/api/download/${taskId}/json'">${ICONS.download} JSON</button>
                `;
            }
            document.getElementById('results-actions').innerHTML = actionsHtml;

            // Summary dashboard
            let maxCount = 0;
            for (const items of Object.values(result.data)) {
                if (items.length > maxCount) maxCount = items.length;
            }
            let summaryHtml = '';
            for (const [key, items] of Object.entries(result.data)) {
                const label = SECTION_LABELS[key] || key;
                const pct = maxCount > 0 ? (items.length / maxCount) * 100 : 0;
                summaryHtml += `
                    <div class="summary-card">
                        <div class="summary-card-label">${label}</div>
                        <div class="summary-card-value">${items.length} <span>건</span></div>
                        <div class="summary-card-bar"><div class="summary-card-bar-fill" style="width:${pct}%"></div></div>
                    </div>
                `;
            }
            document.getElementById('summary-grid').innerHTML = summaryHtml;

            // Report tab
            document.getElementById('report-content').innerHTML = renderMarkdown(result.markdown);
            generateTOC();

            // Data tab
            let dataHtml = '';
            for (const [key, items] of Object.entries(result.data)) {
                const label = SECTION_LABELS[key] || key;
                dataHtml += `
                    <div class="data-section" data-section-key="${key}" onclick="this.classList.toggle('open')">
                        <div class="data-section-header">
                            <div class="data-section-left">
                                ${ICONS.arrow}
                                <span class="data-section-title">${label}</span>
                            </div>
                            <span class="data-section-count">${items.length}건</span>
                        </div>
                        <div class="data-section-body">
                            ${items.map(item => `
                                <div class="data-item" data-searchable="${escapeHtml((item.title || '') + ' ' + (item.content || '')).toLowerCase()}">
                                    ${item.title ? `<div class="data-item-title">${escapeHtml(item.title)}</div>` : ''}
                                    <div class="data-item-meta">
                                        ${item.date ? `<span class="data-item-date">${escapeHtml(item.date)}</span>` : ''}
                                        ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank">${escapeHtml(item.url)}</a>` : ''}
                                    </div>
                                    ${item.content ? `<div class="data-item-content">${escapeHtml(item.content)}</div>` : ''}
                                </div>
                            `).join('')}
                        </div>
                    </div>
                `;
            }
            document.getElementById('data-content').innerHTML = dataHtml;

            // Clear filter
            document.getElementById('results-filter').value = '';

            // Scroll to results
            setTimeout(() => {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }, 200);
        }

        /* ── Copy Report ── */
        function copyReport() {
            if (!currentResultData) return;
            navigator.clipboard.writeText(currentResultData.markdown).then(() => {
                showToast('리포트가 클립보드에 복사되었습니다.', 'success');
            }).catch(() => {
                showToast('복사 실패', 'error');
            });
        }

        /* ── Filter Results ── */
        function filterResults(query) {
            const q = query.trim().toLowerCase();
            const sections = document.querySelectorAll('.data-section');

            sections.forEach(section => {
                const items = section.querySelectorAll('.data-item');
                let visibleCount = 0;
                items.forEach(item => {
                    const text = item.getAttribute('data-searchable') || '';
                    if (!q || text.includes(q)) {
                        item.classList.remove('filtered-out');
                        visibleCount++;
                        // Highlight matching text in title
                        if (q) {
                            const titleEl = item.querySelector('.data-item-title');
                            if (titleEl) {
                                const orig = titleEl.textContent;
                                const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                                titleEl.innerHTML = escapeHtml(orig).replace(regex, '<span class="highlight">$1</span>');
                            }
                        } else {
                            const titleEl = item.querySelector('.data-item-title');
                            if (titleEl) titleEl.innerHTML = escapeHtml(titleEl.textContent);
                        }
                    } else {
                        item.classList.add('filtered-out');
                    }
                });
                section.classList.toggle('filtered-out', visibleCount === 0 && !!q);
                // Auto-open sections with matches
                if (q && visibleCount > 0) {
                    section.classList.add('open');
                } else if (!q) {
                    section.classList.remove('open');
                }
            });

            // Also filter report content
            const reportEl = document.getElementById('report-content');
            if (q && reportEl.innerHTML) {
                // Remove old highlights
                reportEl.innerHTML = reportEl.innerHTML.replace(/<span class="highlight">(.*?)<\/span>/g, '$1');
                // Add new highlights
                if (q.length >= 2) {
                    const regex = new RegExp(`(${q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&')})`, 'gi');
                    reportEl.innerHTML = reportEl.innerHTML.replace(
                        />([^<]+)</g,
                        (match, text) => '>' + text.replace(regex, '<span class="highlight">$1</span>') + '<'
                    );
                }
            } else if (!q && reportEl.innerHTML) {
                reportEl.innerHTML = reportEl.innerHTML.replace(/<span class="highlight">(.*?)<\/span>/g, '$1');
            }
        }

        /* ── Markdown Renderer ── */
        function renderMarkdown(md) {
            if (!md) return '';
            let html = md
                .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
                .replace(/```\n?([\s\S]*?)```/g, '<pre><code>$1</code></pre>')
                .replace(/^### (.+)$/gm, '<h3>$1</h3>')
                .replace(/^## (.+)$/gm, '<h2>$1</h2>')
                .replace(/^# (.+)$/gm, '<h1>$1</h1>')
                .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
                .replace(/_(.+?)_/g, '<em>$1</em>')
                .replace(/\[([^\]]+)\]\(([^)]+)\)/g, '<a href="$2" target="_blank">$1</a>')
                .replace(/^&gt; (.+)$/gm, '<blockquote>$1</blockquote>')
                .replace(/^- (.+)$/gm, '<li>$1</li>')
                .replace(/^---$/gm, '<hr>')
                .replace(/\n\n/g, '</p><p>')
                .replace(/\n/g, '<br>');
            return `<p>${html}</p>`;
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        /* ── History ── */
        async function loadHistory() {
            try {
                const res = await fetch('/api/history');
                const items = await res.json();
                const listEl = document.getElementById('history-list');

                if (items.length === 0) {
                    listEl.innerHTML = `
                        <div class="empty-state">
                            <div class="empty-icon">
                                <svg fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6h4.5m4.5 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                            </div>
                            <p>아직 리서치 기록이 없습니다.</p>
                        </div>
                    `;
                    return;
                }

                if (compareMode) {
                    listEl.innerHTML = items.map(item => `
                        <div class="compare-select-item" onclick="toggleCompareSelect('${item.filename}', this)">
                            <input type="checkbox" onclick="event.stopPropagation()">
                            <div class="compare-select-info">
                                <h5>${escapeHtml(item.company)} / ${escapeHtml(item.job)}</h5>
                                <span>${item.date}</span>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listEl.innerHTML = items.map(item => `
                        <div class="history-item">
                            <div class="history-item-info" onclick="loadHistoryDetail('${item.filename}')">
                                <h4>${escapeHtml(item.company)} / ${escapeHtml(item.job)}</h4>
                                <span>${item.filename}</span>
                            </div>
                            <div class="history-item-right">
                                <div class="history-item-date">${item.date}</div>
                                <button class="btn-delete-history" onclick="deleteHistory('${item.filename}', event)" title="삭제">
                                    ${ICONS.trash}
                                </button>
                            </div>
                        </div>
                    `).join('');
                }
            } catch (err) {
                console.error('기록 로드 실패:', err);
            }
        }

        async function deleteHistory(filename, event) {
            event.stopPropagation();
            if (!confirm('이 리서치 기록을 삭제하시겠습니까?')) return;
            try {
                const res = await fetch(`/api/history/${filename}`, { method: 'DELETE' });
                const result = await res.json();
                if (result.ok) {
                    showToast('기록이 삭제되었습니다.', 'success');
                    loadHistory();
                } else {
                    showToast('삭제 실패', 'error');
                }
            } catch (err) {
                showToast('삭제 실패', 'error');
            }
        }

        async function loadHistoryDetail(filename) {
            try {
                const res = await fetch(`/api/history/${filename}`);
                const result = await res.json();
                if (result.error) return;

                document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
                document.getElementById('page-search').classList.add('active');
                document.querySelectorAll('.header-nav button').forEach(b => b.classList.remove('active'));
                document.querySelector('.header-nav button').classList.add('active');

                document.getElementById('progress-card').classList.remove('show');
                displayResult(result, null);
            } catch (err) {
                console.error('상세 로드 실패:', err);
            }

        /* ── Dark Mode ── */
        function toggleDarkMode() {
            const isDark = document.body.classList.toggle('dark');
            localStorage.setItem('darkMode', isDark ? '1' : '0');
            updateThemeIcon(isDark);
        }
        function updateThemeIcon(isDark) {
            document.getElementById('theme-icon-sun').style.display = isDark ? '' : 'none';
            document.getElementById('theme-icon-moon').style.display = isDark ? 'none' : '';
        }
        // Init dark mode from localStorage
        if (localStorage.getItem('darkMode') === '1') {
            document.body.classList.add('dark');
            updateThemeIcon(true);
        }

        /* ── Browser Notification ── */
        function requestNotificationPermission() {
            if ('Notification' in window && Notification.permission === 'default') {
                Notification.requestPermission();
            }
        }
        function sendBrowserNotification(title, body) {
            if ('Notification' in window && Notification.permission === 'granted') {
                new Notification(title, { body, icon: '' });
            }
        }
        requestNotificationPermission();

        /* ── Tab Title Progress ── */
        const originalTitle = document.title;
        function updateTabTitle(text) {
            document.title = text ? `${text} - 기업 리서치` : originalTitle;
        }

        /* ── Back to Top ── */
        window.addEventListener('scroll', function() {
            const btn = document.getElementById('back-to-top');
            btn.classList.toggle('show', window.scrollY > 400);
        });

        /* ── TOC Generation ── */
        function generateTOC() {
            const reportEl = document.getElementById('report-content');
            const tocEl = document.getElementById('report-toc');
            const headings = reportEl.querySelectorAll('h1, h2, h3');
            if (headings.length === 0) { tocEl.innerHTML = ''; return; }

            let html = '<div class="report-toc-title">목차</div>';
            headings.forEach((h, i) => {
                const id = `toc-heading-${i}`;
                h.id = id;
                const tag = h.tagName.toLowerCase();
                const cls = tag === 'h1' ? 'toc-h1' : tag === 'h2' ? 'toc-h2' : 'toc-h3';
                html += `<a href="#${id}" class="${cls}" onclick="event.preventDefault(); document.getElementById('${id}').scrollIntoView({behavior:'smooth', block:'start'})">${h.textContent}</a>`;
            });
            tocEl.innerHTML = html;
        }

        /* ── Expand/Collapse All ── */
        function toggleAllSections(open) {
            document.querySelectorAll('.data-section').forEach(s => {
                s.classList.toggle('open', open);
            });
        }

        /* ── Compare Mode ── */
        let compareMode = false;
        let compareSelections = [];

        function toggleCompareMode() {
            compareMode = !compareMode;
            compareSelections = [];
            document.getElementById('btn-compare-mode').textContent = compareMode ? '비교 모드 해제' : '비교 모드';
            document.getElementById('compare-actions').style.display = compareMode ? 'flex' : 'none';
            loadHistory();
        }

        async function runCompare() {
            if (compareSelections.length !== 2) {
                showToast('비교할 기록 2개를 선택해주세요.', 'warning');
                return;
            }
            try {
                const res = await fetch('/api/compare', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ files: compareSelections }),
                });
                const results = await res.json();
                if (results.error) { showToast(results.error, 'error'); return; }
                displayCompare(results);
            } catch (err) {
                showToast('비교 실패', 'error');
            }
        }

        function toggleCompareSelect(filename, el) {
            const idx = compareSelections.indexOf(filename);
            if (idx >= 0) {
                compareSelections.splice(idx, 1);
                el.classList.remove('selected');
                el.querySelector('input').checked = false;
            } else {
                if (compareSelections.length >= 2) {
                    showToast('최대 2개까지 선택할 수 있습니다.', 'warning');
                    return;
                }
                compareSelections.push(filename);
                el.classList.add('selected');
                el.querySelector('input').checked = true;
            }
        }

        function displayCompare(results) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById('page-compare').classList.add('active');

            const [a, b] = results;
            const allKeys = [...new Set([...Object.keys(a.data), ...Object.keys(b.data)])];
            const maxTotal = Math.max(a.total_items, b.total_items, 1);

            let barsHtml = '';
            allKeys.forEach(key => {
                const label = SECTION_LABELS[key] || key;
                const aCount = (a.data[key] || []).length;
                const bCount = (b.data[key] || []).length;
                const maxVal = Math.max(aCount, bCount, 1);
                barsHtml += `
                    <div class="compare-bar-row">
                        <span class="compare-bar-label">${label}</span>
                        <div class="compare-bar-track"><div class="compare-bar-fill a" style="width:${(aCount/maxVal)*100}%"></div></div>
                        <span class="compare-bar-val">${aCount}</span>
                        <div class="compare-bar-track"><div class="compare-bar-fill b" style="width:${(bCount/maxVal)*100}%"></div></div>
                        <span class="compare-bar-val">${bCount}</span>
                    </div>
                `;
            });

            document.getElementById('compare-content').innerHTML = `
                <div class="compare-grid">
                    <div class="compare-col">
                        <h4 style="color: var(--blue)">${escapeHtml(a.company)} / ${escapeHtml(a.job)}</h4>
                        <div class="compare-row"><span class="compare-row-label">총 수집 항목</span><span class="compare-row-value">${a.total_items}건</span></div>
                        <div class="compare-row"><span class="compare-row-label">카테고리</span><span class="compare-row-value">${Object.keys(a.data).length}개</span></div>
                    </div>
                    <div class="compare-col">
                        <h4 style="color: var(--green)">${escapeHtml(b.company)} / ${escapeHtml(b.job)}</h4>
                        <div class="compare-row"><span class="compare-row-label">총 수집 항목</span><span class="compare-row-value">${b.total_items}건</span></div>
                        <div class="compare-row"><span class="compare-row-label">카테고리</span><span class="compare-row-value">${Object.keys(b.data).length}개</span></div>
                    </div>
                </div>
                <div style="margin-top:1.5rem; background:var(--white); border:1px solid var(--border); border-radius:var(--radius); padding:1.5rem; box-shadow:var(--shadow)">
                    <h4 style="font-size:0.9rem; margin-bottom:1rem; color:var(--text)">카테고리별 비교</h4>
                    <div style="display:flex; gap:1rem; margin-bottom:0.8rem; font-size:0.75rem">
                        <span style="display:flex; align-items:center; gap:0.3rem"><span style="width:12px;height:12px;background:var(--blue);border-radius:2px;display:inline-block"></span>${escapeHtml(a.company)}</span>
                        <span style="display:flex; align-items:center; gap:0.3rem"><span style="width:12px;height:12px;background:var(--green);border-radius:2px;display:inline-block"></span>${escapeHtml(b.company)}</span>
                    </div>
                    <div class="compare-bar-container">${barsHtml}</div>
                </div>
            `;
        }

        /* ── Keyboard Shortcuts ── */
        document.addEventListener('keydown', function (e) {
            // Ctrl+Enter: start crawl
            if ((e.ctrlKey || e.metaKey) && e.key === 'Enter') {
                e.preventDefault();
                startCrawl();
            }
            // Esc: cancel crawl
            if (e.key === 'Escape') {
                const btn = document.getElementById('btn-cancel');
                if (btn && btn.style.display !== 'none') {
                    cancelCrawl();
                }
            }
            // Ctrl+D: toggle dark mode
            if ((e.ctrlKey || e.metaKey) && e.key === 'd') {
                e.preventDefault();
                toggleDarkMode();
            }
        });

        /* ── Init ── */
        document.addEventListener('DOMContentLoaded', function () {
            ['company', 'job'].forEach(id => {
                document.getElementById(id).addEventListener('keypress', function (e) {
                    if (e.key === 'Enter') startCrawl();
                });
            });
        });
    </script>
</body>
</html>
